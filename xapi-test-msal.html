<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xAPI Test · MS365 Login</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;max-width:480px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.logo-dot{width:10px;height:10px;border-radius:50%;background:#1e3a5f}
.logo-text{font-size:13px;font-weight:700;color:#1e3a5f;letter-spacing:.04em;text-transform:uppercase}

h1{font-size:18px;font-weight:700;color:#0f172a;margin-bottom:6px}
.sub{font-size:14px;color:#64748b;margin-bottom:24px;line-height:1.5}

/* User info */
.user-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:14px 16px;margin-bottom:20px;display:none}
.user-box.visible{display:block}
.user-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#0369a1;margin-bottom:6px}
.user-name{font-size:15px;font-weight:700;color:#0c4a6e}
.user-email{font-size:13px;color:#0369a1;margin-top:2px;font-family:monospace}

/* Config */
.cfg{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:20px}
.cfg-ttl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:10px}
.cfg-grid{display:flex;flex-direction:column;gap:8px}
.cf label{display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.cf input{width:100%;border:1px solid #e2e8f0;border-radius:7px;padding:7px 10px;font-size:13px;color:#1e293b;background:#fff;outline:none;transition:border-color .2s}
.cf input:focus{border-color:#93c5fd}

/* Buttons */
.btn-ms{width:100%;background:#0078d4;color:#fff;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:10px;transition:background .2s}
.btn-ms:hover{background:#106ebe}
.btn-ms:disabled{background:#94a3b8;cursor:default}
.btn-send{width:100%;background:#1e3a5f;color:#fff;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .2s}
.btn-send:hover:not(:disabled){background:#1d4ed8}
.btn-send:disabled{background:#94a3b8;cursor:default}
.btn-out{width:100%;background:none;color:#64748b;border:1px solid #e2e8f0;border-radius:9px;padding:8px;font-size:13px;cursor:pointer;margin-top:8px;transition:all .2s}
.btn-out:hover{border-color:#94a3b8;color:#1e293b}

/* Status */
.status{margin-top:14px;font-size:13px;color:#64748b;min-height:20px;text-align:center}
.status.ok{color:#16a34a;font-weight:600}
.status.err{color:#dc2626;font-weight:500}
.status.loading{color:#2563eb}

/* Statement preview */
.preview{margin-top:14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;display:none}
.preview.visible{display:block}
.preview-ttl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:6px}
.preview pre{font-size:11px;font-family:monospace;color:#475569;white-space:pre-wrap;word-break:break-all;line-height:1.6}

.divider{border:none;border-top:1px solid #f1f5f9;margin:16px 0}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">xAPI · MS365 Tools</span>
  </div>

  <h1>Send xAPI Statement</h1>
  <p class="sub">Sign in with your Microsoft 365 account — your identity will be used as the xAPI actor.</p>

  <!-- User info (shown after login) -->
  <div class="user-box" id="user-box">
    <div class="user-label">Signed in as</div>
    <div class="user-name" id="user-name"></div>
    <div class="user-email" id="user-email"></div>
  </div>

  <!-- LRS Config -->
  <div class="cfg">
    <div class="cfg-ttl">LRS Configuration</div>
    <div class="cfg-grid">
      <div class="cf">
        <label>LRS Statements Endpoint</label>
        <input type="text" id="lrs-ep" placeholder="https://your-lrs/xAPI/statements">
      </div>
      <div class="cf">
        <label>Username / Client ID</label>
        <input type="text" id="lrs-user" placeholder="username">
      </div>
      <div class="cf">
        <label>Password / Secret</label>
        <input type="password" id="lrs-pass" placeholder="password">
      </div>
      <div class="cf">
        <label>Actor homePage (your LMS base URL)</label>
        <input type="text" id="lrs-hp" placeholder="https://your-tenant.fa.oraclecloud.com">
      </div>
    </div>
  </div>

  <!-- Sign in button -->
  <button class="btn-ms" id="btn-login" onclick="doLogin()">
    <svg width="16" height="16" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
      <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
    </svg>
    Sign in with Microsoft 365
  </button>

  <!-- Send button (hidden until login) -->
  <button class="btn-send" id="btn-send" onclick="doSend()" disabled style="display:none">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    Send completion statement
  </button>

  <button class="btn-out" id="btn-logout" onclick="doLogout()" style="display:none">Sign out</button>

  <div class="status" id="status"></div>

  <!-- Statement preview -->
  <div class="preview" id="preview">
    <div class="preview-ttl">Statement preview</div>
    <pre id="preview-json"></pre>
  </div>
</div>

<script>
const MSAL_CONFIG = {
  auth: {
    clientId: '90bb4797-9bfc-4a7a-9ffa-0684ee7ee13c',
    authority: 'https://login.microsoftonline.com/16a66ef2-971f-4366-b8ad-9805ce738ec8',
    redirectUri: window.location.href.split('?')[0]
  },
  cache: { cacheLocation: 'sessionStorage' }
};

const GRAPH_SCOPES = ['User.Read'];

let msalInstance;
let currentUser = null;

window.onload = async function() {
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();

  // Handle redirect response
  try {
    const resp = await msalInstance.handleRedirectPromise();
    if (resp) {
      setUser(resp.account, resp.idTokenClaims);
      return;
    }
  } catch(e) {
    showStatus('Login error: ' + e.message, 'err');
  }

  // Check if already logged in
  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    try {
      const silentResp = await msalInstance.acquireTokenSilent({
        scopes: GRAPH_SCOPES,
        account: accounts[0]
      });
      setUser(silentResp.account, silentResp.idTokenClaims);
    } catch(e) {
      // Silent failed, user needs to click login
    }
  }
};

function setUser(account, claims) {
  const email = account.username || (claims && claims.email) || (claims && claims.preferred_username) || account.username;
  const name = account.name || (claims && claims.name) || email;
  currentUser = { email, name };

  document.getElementById('user-name').textContent = name;
  document.getElementById('user-email').textContent = email;
  document.getElementById('user-box').classList.add('visible');

  document.getElementById('btn-login').style.display = 'none';
  document.getElementById('btn-send').style.display = 'flex';
  document.getElementById('btn-send').disabled = false;
  document.getElementById('btn-logout').style.display = 'block';

  showStatus('');
  updatePreview();
}

async function doLogin() {
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  showStatus('Redirecting to Microsoft login…', 'loading');
  try {
    await msalInstance.loginRedirect({ scopes: GRAPH_SCOPES });
  } catch(e) {
    showStatus('Login error: ' + e.message, 'err');
    btn.disabled = false;
  }
}

function doLogout() {
  msalInstance.logoutRedirect();
}

function updatePreview() {
  if (!currentUser) return;
  const hp = document.getElementById('lrs-hp').value || 'https://your-lms.example.com';
  const stmt = buildStatement(hp);
  document.getElementById('preview-json').textContent = JSON.stringify(stmt, null, 2);
  document.getElementById('preview').classList.add('visible');
}

document.addEventListener('input', function(e) {
  if (e.target.id === 'lrs-hp') updatePreview();
});

function buildStatement(hp) {
  return {
    actor: {
      objectType: 'Agent',
      name: currentUser.name,
      account: { homePage: hp, name: currentUser.email }
    },
    verb: {
      id: 'http://adlnet.gov/expapi/verbs/completed',
      display: { 'en-US': 'completed' }
    },
    object: {
      id: 'urn:xapi:ms365:test',
      objectType: 'Activity',
      definition: {
        name: { 'en-US': 'xAPI MS365 Test' },
        type: 'http://adlnet.gov/expapi/activities/lesson'
      }
    },
    result: { completion: true, success: true }
  };
}

async function doSend() {
  if (!currentUser) return;
  const ep   = document.getElementById('lrs-ep').value.trim();
  const u    = document.getElementById('lrs-user').value.trim();
  const p    = document.getElementById('lrs-pass').value.trim();
  const hp   = document.getElementById('lrs-hp').value.trim();
  const btn  = document.getElementById('btn-send');

  if (!ep) { showStatus('Please enter the LRS endpoint.', 'err'); return; }

  btn.disabled = true;
  showStatus('Sending…', 'loading');

  const stmt = buildStatement(hp);
  updatePreview();

  try {
    const hdrs = {
      'Content-Type': 'application/json',
      'X-Experience-API-Version': '1.0.3'
    };
    if (u) hdrs['Authorization'] = 'Basic ' + btoa(u + ':' + p);

    const res = await fetch(ep, { method: 'POST', headers: hdrs, body: JSON.stringify(stmt) });

    if (res.ok) {
      showStatus('✓ Statement sent! Actor: ' + currentUser.email, 'ok');
    } else {
      const txt = await res.text();
      showStatus('LRS error ' + res.status + ': ' + txt.substring(0, 120), 'err');
      btn.disabled = false;
    }
  } catch(e) {
    showStatus('Network error: ' + e.message, 'err');
    btn.disabled = false;
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}
</script>
</body>
</html>
