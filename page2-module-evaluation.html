<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module Evaluation · xAPI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
#xp2-p2{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;min-height:100vh;padding:28px 20px;color:#1e293b}
.wrap{max-width:680px;margin:0 auto}

/* Config */
.cfg{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:28px}
.cfg-ttl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:14px}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cf{display:flex;flex-direction:column;gap:4px}
.cf.full{grid-column:1/-1}
.cf label{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em}
.cf input{border:1px solid #e2e8f0;border-radius:7px;padding:7px 11px;font-size:13px;color:#1e293b;background:#f8fafc;outline:none;transition:border-color .2s,background .2s}
.cf input:focus{border-color:#93c5fd;background:#fff}

/* Header */
.hdr{margin-bottom:26px}
.hdr h1{font-size:21px;font-weight:700;color:#0f172a;letter-spacing:-.01em}
.hdr p{font-size:14px;color:#64748b;margin-top:5px;line-height:1.55}
.user-pill{display:inline-flex;align-items:center;gap:7px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;padding:5px 13px;font-size:12px;color:#1d4ed8;font-weight:600;margin-top:10px}

/* Module cards */
.mods{display:flex;flex-direction:column;gap:18px}
.mcard{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:22px;transition:border-color .3s,background .3s}
.mcard.sent{border-color:#86efac;background:#f0fdf4}

.mcard-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #f1f5f9}
.mcard.sent .mcard-hdr{border-bottom-color:#dcfce7}
.mtitle{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:#0f172a}
.mnum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#e0e7ff;color:#4338ca;font-size:12px;font-weight:700;flex-shrink:0}
.mcard.sent .mnum{background:#dcfce7;color:#16a34a}
.sent-badge{display:inline-flex;align-items:center;gap:5px;background:#dcfce7;border:1px solid #86efac;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:#16a34a}

/* Completion row */
.comp-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:12px 14px;background:#f8fafc;border-radius:9px;border:1px solid #e2e8f0}
.comp-check{width:18px;height:18px;cursor:pointer;accent-color:#2563eb;flex-shrink:0}
.comp-check:disabled{cursor:default}
.comp-label{font-size:14px;color:#475569;cursor:pointer;flex:1}

/* Controls */
.ctrl-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.ctrl-grp{display:flex;flex-direction:column;gap:8px}
.ctrl-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8}
.toggle-inline{display:flex;align-items:center;gap:10px}
.tog-txt{font-size:13px;font-weight:600;color:#94a3b8;transition:color .2s}
.tog-txt.yes{color:#16a34a}
.tog-txt.no{color:#dc2626}

/* Score */
.score-wrap{display:flex;align-items:center;gap:10px}
.score-slider{flex:1;accent-color:#2563eb;cursor:pointer}
.score-val{font-size:20px;font-weight:800;color:#0f172a;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}

/* Switch */
.sw{position:relative;display:inline-block;width:38px;height:21px}
.sw input{opacity:0;width:0;height:0}
.sw-tr{position:absolute;top:0;left:0;right:0;bottom:0;background:#cbd5e1;border-radius:21px;transition:.25s;cursor:pointer}
.sw-tr::before{position:absolute;content:"";height:15px;width:15px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s}
.sw input:checked+.sw-tr{background:#22c55e}
.sw input:checked+.sw-tr::before{transform:translateX(17px)}
.sw input:disabled+.sw-tr{opacity:.35;cursor:default}

/* Footer */
.card-footer{display:flex;align-items:center;gap:14px;padding-top:14px;border-top:1px solid #f1f5f9}
.mcard.sent .card-footer{border-top-color:#dcfce7}
.btn{background:#1e3a5f;color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .2s,transform .1s}
.btn:hover:not(:disabled){background:#1d4ed8}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{background:#94a3b8;cursor:default}
.st{font-size:13px;color:#64748b}
.st.ok{color:#16a34a;font-weight:600}
.st.err{color:#dc2626;font-weight:500}
.st.loading{color:#2563eb}

.sent-summary{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#16a34a}
.sent-detail{font-size:12px;font-weight:400;color:#4ade80;margin-left:2px}
</style>
</head>
<body>
<div id="xp2-p2">
</div>
<div class="wrap">

<div class="cfg">
  <div class="cfg-ttl">LRS Configuration</div>
  <div class="cfg-grid">
    <div class="cf full">
      <label>LRS Statements Endpoint</label>
      <input type="text" id="p2-ep" placeholder="https://your-lrs/xAPI/statements">
    </div>
    <div class="cf">
      <label>Username / Client ID</label>
      <input type="text" id="p2-user" placeholder="username">
    </div>
    <div class="cf">
      <label>Password / Secret</label>
      <input type="password" id="p2-pass" placeholder="password">
    </div>
    <div class="cf full">
      <label>Actor homePage (Fusion base URL)</label>
      <input type="text" id="p2-hp" placeholder="https://your-tenant.fa.oraclecloud.com">
    </div>
  </div>
</div>

<div class="hdr">
  <h1>Module Evaluation</h1>
  <p>For each onboarding module, confirm completion and rate your experience. Each evaluation is sent as a separate xAPI statement.</p>
  <div class="user-pill">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <span id="p2-uname">Loading…</span>
  </div>
</div>

<div class="mods" id="p2-mods"></div>

</div>
</div>

<script>
(function(){
const MODS=[
  {id:'it',iri:'urn:xapi:onboarding:it',title:'IT Onboarding',n:1},
  {id:'compliance',iri:'urn:xapi:onboarding:compliance',title:'Compliance Onboarding',n:2},
  {id:'ld',iri:'urn:xapi:onboarding:ld',title:'L&D Onboarding',n:3}
];

// Read user identity from localStorage (set by index.html after MSAL login)
const _storedEmail = localStorage.getItem('xapi_user_email');
const _storedName  = localStorage.getItem('xapi_user_name');
let uEmail = _storedEmail || '';

// Call immediately — no async needed
window.addEventListener('DOMContentLoaded', onUserReady);

function onUserReady() {
  if (!uEmail) {
    // Not logged in — show message
    const wrap = document.querySelector('#p2-p1, #p2-p2, #p2-p3, #xp2-p2') || document.body;
    const msg = document.createElement('div');
    msg.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(248,250,252,.97);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:-apple-system,sans-serif;text-align:center;padding:20px';
    msg.innerHTML = '<p style="font-size:15px;font-weight:700;color:#0f172a">Sign in required</p><p style="font-size:13px;color:#64748b">Please sign in from the main page first.</p><a href="index.html" style="background:#1e3a5f;color:#fff;border-radius:8px;padding:10px 22px;font-size:13px;font-weight:700;text-decoration:none">← Back to main page</a>';
    document.body.appendChild(msg);
    return;
  }
})();
</script>
</body>
</html>
