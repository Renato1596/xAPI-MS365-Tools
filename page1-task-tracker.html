<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Task Tracker · xAPI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
#xp2-p1{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;min-height:100vh;padding:28px 20px;color:#1e293b}
.wrap{max-width:680px;margin:0 auto}

/* Config */
.cfg{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:28px}
.cfg-ttl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:14px}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cf{display:flex;flex-direction:column;gap:4px}
.cf.full{grid-column:1/-1}
.cf label{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em}
.cf input{border:1px solid #e2e8f0;border-radius:7px;padding:7px 11px;font-size:13px;color:#1e293b;background:#f8fafc;outline:none;transition:border-color .2s,background .2s}
.cf input:focus{border-color:#93c5fd;background:#fff}

/* Header */
.hdr{margin-bottom:22px}
.hdr h1{font-size:21px;font-weight:700;color:#0f172a;letter-spacing:-.01em}
.hdr p{font-size:14px;color:#64748b;margin-top:5px;line-height:1.55}
.user-pill{display:inline-flex;align-items:center;gap:7px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;padding:5px 13px;font-size:12px;color:#1d4ed8;font-weight:600;margin-top:10px}

/* Tabs */
.tabs{display:flex;border-bottom:1.5px solid #e2e8f0;margin-bottom:22px;gap:0;overflow-x:auto}
.tab{padding:10px 20px;font-size:13px;font-weight:600;color:#64748b;background:none;border:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;cursor:pointer;transition:color .2s,border-color .2s;white-space:nowrap}
.tab:hover{color:#0f172a}
.tab.on{color:#1e3a5f;border-bottom-color:#1e3a5f}
.panel{display:none}
.panel.on{display:block}

/* Tasks */
.task-list{display:flex;flex-direction:column;gap:9px}
.trow{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:14px;transition:border-color .2s,background .2s}
.trow.done{border-color:#86efac;background:#f0fdf4}
.trow.done.disabled{border-color:#bbf7d0;background:#f7fef9}
.trow.nosend{opacity:.55}
.tcheck{width:18px;height:18px;cursor:pointer;accent-color:#16a34a;flex-shrink:0}
.tcheck:disabled{cursor:default}
.tlabel{flex:1;font-size:14px;color:#475569;line-height:1.4}
.trow.done .tlabel{color:#15803d;font-weight:500}

/* Toggle switch */
.sw-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sw-text{font-size:11px;font-weight:600;color:#94a3b8;min-width:46px;text-align:right;transition:color .2s}
.sw-text.pos{color:#16a34a}
.sw{position:relative;display:inline-block;width:38px;height:21px}
.sw input{opacity:0;width:0;height:0}
.sw-tr{position:absolute;top:0;left:0;right:0;bottom:0;background:#cbd5e1;border-radius:21px;transition:.25s;cursor:pointer}
.sw-tr::before{position:absolute;content:"";height:15px;width:15px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s}
.sw input:checked+.sw-tr{background:#22c55e}
.sw input:checked+.sw-tr::before{transform:translateX(17px)}
.sw input:disabled+.sw-tr{opacity:.35;cursor:default}

/* Send bar */
.sbar{margin-top:20px;display:flex;align-items:center;gap:14px;padding-top:4px}
.btn{background:#1e3a5f;color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .2s,transform .1s;letter-spacing:.01em}
.btn:hover:not(:disabled){background:#1d4ed8}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{background:#94a3b8;cursor:default}
.st{font-size:13px;color:#64748b}
.st.ok{color:#16a34a;font-weight:600}
.st.err{color:#dc2626;font-weight:500}
.st.loading{color:#2563eb}
</style>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
</head>
<body>
<div id="xp2-p1">
<div id="auth-overlay" style="display:flex;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(248,250,252,.95);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <div style="font-family:-apple-system,sans-serif;text-align:center">
    <p style="font-size:15px;font-weight:700;color:#0f172a;margin-bottom:6px">Sign in required</p>
    <p style="font-size:13px;color:#64748b;margin-bottom:20px">Sign in with your Microsoft 365 account to continue</p>
    <button onclick="msalApp.loginRedirect({scopes:['User.Read']})" style="background:#0078d4;color:#fff;border:none;border-radius:9px;padding:11px 24px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:9px">
      <svg width="16" height="16" viewBox="0 0 21 21" fill="none"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Sign in with Microsoft 365
    </button>
    <p style="margin-top:12px;font-size:12px;color:#94a3b8"><a href="index.html" style="color:#2563eb">← Back to tools</a></p>
  </div>
</div>
<div class="wrap">

<div class="cfg">
  <div class="cfg-ttl">LRS Configuration</div>
  <div class="cfg-grid">
    <div class="cf full">
      <label>LRS Statements Endpoint</label>
      <input type="text" id="p1-ep" placeholder="https://your-lrs/xAPI/statements">
    </div>
    <div class="cf">
      <label>Username / Client ID</label>
      <input type="text" id="p1-user" placeholder="username">
    </div>
    <div class="cf">
      <label>Password / Secret</label>
      <input type="password" id="p1-pass" placeholder="password">
    </div>
    <div class="cf full">
      <label>Actor homePage (Fusion base URL)</label>
      <input type="text" id="p1-hp" placeholder="https://your-tenant.fa.oraclecloud.com">
    </div>
  </div>
</div>

<div class="hdr">
  <h1>Onboarding Task Tracker</h1>
  <p>For each onboarding area, mark the tasks you have completed and toggle whether the outcome was positive.</p>
  <div class="user-pill">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <span id="p1-uname">Loading…</span>
  </div>
</div>

<div class="tabs">
  <button class="tab on" onclick="showTab('it',this)">IT Onboarding</button>
  <button class="tab" onclick="showTab('compliance',this)">Compliance</button>
  <button class="tab" onclick="showTab('ld',this)">L&amp;D Onboarding</button>
</div>

<div id="p1-it" class="panel on"></div>
<div id="p1-compliance" class="panel"></div>
<div id="p1-ld" class="panel"></div>

</div>
</div>

<script>
(function(){
const MODS=[
  {id:'it',iri:'urn:xapi:onboarding:it',title:'IT Onboarding',tasks:[
    {id:'it1',label:'Set up company email account'},
    {id:'it2',label:'Install required software and tools'},
    {id:'it3',label:'Complete IT security briefing'},
    {id:'it4',label:'Configure VPN access'},
    {id:'it5',label:'Register company devices with IT'}
  ]},
  {id:'compliance',iri:'urn:xapi:onboarding:compliance',title:'Compliance Onboarding',tasks:[
    {id:'co1',label:'Read and acknowledge the Code of Conduct'},
    {id:'co2',label:'Complete GDPR awareness training'},
    {id:'co3',label:'Sign NDA and compliance documentation'},
    {id:'co4',label:'Complete anti-bribery and corruption training'},
    {id:'co5',label:'Review data classification and handling policy'}
  ]},
  {id:'ld',iri:'urn:xapi:onboarding:ld',title:'L&D Onboarding',tasks:[
    {id:'ld1',label:'Meet with your L&D coordinator'},
    {id:'ld2',label:'Explore the learning catalogue'},
    {id:'ld3',label:'Create and configure your LMS account'},
    {id:'ld4',label:'Complete the learning needs assessment'},
    {id:'ld5',label:'Agree on your first 30-day learning plan'}
  ]}
];

const MSAL_CFG={auth:{clientId:'90bb4797-9bfc-4a7a-9ffa-0684ee7ee13c',authority:'https://login.microsoftonline.com/16a66ef2-971f-4366-b8ad-9805ce738ec8',redirectUri:window.location.href.split('?')[0].split('#')[0]},cache:{cacheLocation:'localStorage',storeAuthStateInCookie:true}};
let uEmail='';
let msalApp;
async function initAuth(){
  msalApp=new msal.PublicClientApplication(MSAL_CFG);
  await msalApp.initialize();
  try{const r=await msalApp.handleRedirectPromise();if(r){uEmail=r.account.username;onUserReady();return;}}catch(e){}
  const accs=msalApp.getAllAccounts();
  if(accs.length>0){
    try{const r=await msalApp.acquireTokenSilent({scopes:['User.Read'],account:accs[0]});uEmail=r.account.username;onUserReady();return;}catch(e){}
  }
  showLoginBtn();
}
function showLoginBtn(){
  const el=document.getElementById('auth-overlay');
  if(el)el.style.display='flex';
}
function onUserReady(){
  const el=document.getElementById('auth-overlay');
  if(el)el.style.display='none';
document.getElementById('p1-uname').textContent=uEmail;
  // Load LRS config from localStorage (saved on index page)
  const _ep   = localStorage.getItem('xapi_ep');
  const _user = localStorage.getItem('xapi_user');
  const _pass = localStorage.getItem('xapi_pass');
  const _hp   = localStorage.getItem('xapi_hp');
  if (_ep)   document.getElementById('p1-ep').value   = _ep;
  if (_user) document.getElementById('p1-user').value = _user;
  if (_pass) document.getElementById('p1-pass').value = _pass;
  if (_hp)   document.getElementById('p1-hp').value   = _hp;
}

MODS.forEach(mod=>{
  const panel=document.getElementById('p1-'+mod.id);
  let h='<div class="task-list">';
  mod.tasks.forEach(t=>{
    h+=`<div class="trow" id="tr-${t.id}">
      <input type="checkbox" class="tcheck" id="cb-${t.id}" onchange="onCheck('${t.id}')">
      <label class="tlabel" for="cb-${t.id}">${t.label}</label>
      <div class="sw-wrap">
        <span class="sw-text" id="swt-${t.id}">—</span>
        <label class="sw"><input type="checkbox" id="sw-${t.id}" disabled onchange="onSw('${t.id}')"><span class="sw-tr"></span></label>
      </div>
    </div>`;
  });
  h+=`</div>
  <div class="sbar">
    <button class="btn" id="sbtn-${mod.id}" onclick="doSend('${mod.id}')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Send module
    </button>
    <span class="st" id="sst-${mod.id}"></span>
  </div>`;
  panel.innerHTML=h;
});

window.showTab=function(id,btn){
  MODS.forEach(m=>{
    document.getElementById('p1-'+m.id).classList.toggle('on',m.id===id);
  });
  document.querySelectorAll('#xp2-p1 .tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
};

window.onCheck=function(tid){
  const cb=document.getElementById('cb-'+tid);
  const sw=document.getElementById('sw-'+tid);
  const row=document.getElementById('tr-'+tid);
  const txt=document.getElementById('swt-'+tid);
  sw.disabled=!cb.checked;
  if(!cb.checked){sw.checked=false;row.classList.remove('done');txt.textContent='—';txt.className='sw-text';}
  else{row.classList.add('done');txt.textContent='positive';txt.className='sw-text pos';}
};

window.onSw=function(tid){
  const sw=document.getElementById('sw-'+tid);
  const txt=document.getElementById('swt-'+tid);
  txt.textContent=sw.checked?'positive':'neutral';
  txt.className=sw.checked?'sw-text pos':'sw-text';
};

window.doSend=async function(modId){
  const mod=MODS.find(m=>m.id===modId);
  const ep=document.getElementById('p1-ep').value.trim();
  const u=document.getElementById('p1-user').value.trim();
  const p=document.getElementById('p1-pass').value.trim();
  const hp=document.getElementById('p1-hp').value.trim();
  const btn=document.getElementById('sbtn-'+modId);
  const st=document.getElementById('sst-'+modId);

  if(!ep){st.textContent='Please enter the LRS endpoint.';st.className='st err';return;}

  const statements=[];
  mod.tasks.forEach(t=>{
    const cb=document.getElementById('cb-'+t.id);
    if(!cb||!cb.checked)return;
    const sw=document.getElementById('sw-'+t.id);
    statements.push({
      actor:{objectType:'Agent',account:{homePage:hp,name:uEmail}},
      verb:{id:'http://adlnet.gov/expapi/verbs/completed',display:{'en-US':'completed'}},
      object:{
        id:(hp||'https://xapi-demo.org').replace(/\/$/,'')+'/xapi/activities/onboarding/'+modId+'/'+t.id,
        objectType:'Activity',
        definition:{name:{'en-US':t.label},type:'http://adlnet.gov/expapi/activities/task'}
      },
      result:{completion:true,success:sw?sw.checked:false},
      context:{contextActivities:{parent:[{id:(hp||'https://xapi-demo.org').replace(/\/$/,'')+'/xapi/activities/onboarding/'+mod.id,objectType:'Activity'}]}}
    });
  });

  if(!statements.length){st.textContent='No tasks marked as done.';st.className='st err';return;}

  btn.disabled=true;
  st.textContent='Sending…';
  st.className='st loading';

  try{
    const hdrs={'Content-Type':'application/json','X-Experience-API-Version':'1.0.3'};
    if(u)hdrs['Authorization']='Basic '+btoa(u+':'+p);
    const body=statements.length===1?statements[0]:statements;
    const res=await fetch(ep,{method:'POST',headers:hdrs,body:JSON.stringify(body)});
    if(res.ok){
      st.textContent='✓ '+statements.length+' statement'+(statements.length>1?'s':'')+' sent.';
      st.className='st ok';
      mod.tasks.forEach(t=>{
        const cb=document.getElementById('cb-'+t.id);
        const sw=document.getElementById('sw-'+t.id);
        if(cb)cb.disabled=true;
        if(sw)sw.disabled=true;
        document.getElementById('tr-'+t.id).classList.add('disabled');
      });
    }else{
      const txt=await res.text();
      st.textContent='Error '+res.status+': '+txt.substring(0,140);
      st.className='st err';
      btn.disabled=false;
    }
  }catch(e){
    st.textContent='Network error: '+e.message;
    st.className='st err';
    btn.disabled=false;
  }
};
initAuth();
})();
</script>
</body>
</html>
